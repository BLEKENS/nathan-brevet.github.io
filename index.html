  <div class="hero">${coachPic(80)}<div class="bubble"><span class="who">${t("coach")}</span><p>${t("levelTip")}</p></div></div>
  ${frNote()}
  <div class="card ${f.s}" lang="fr"><ul class="fiche">${f.p.map(x=>`<li><span>${x}</span></li>`).join("")}</ul></div>
  <button class="b3 ${f.s}" id="go" style="background:var(--c);box-shadow:0 5px 0 var(--cd)">${t("start")(n)}</button>`;
  document.getElementById("back").onclick=()=>{st.sel=f.s;home()};
  document.getElementById("go").onclick=()=>startQuiz("level",id);
}

let Z=null,iv=null;
function stopTimer(){clearInterval(iv);iv=null}
function startQuiz(kind,key){
  const pool=kind==="level"?QUESTIONS.filter(q=>q.t===key):kind==="defi"?QUESTIONS.filter(q=>q.s===key):kind==="year"?QUESTIONS.filter(q=>q.y===key):QUESTIONS;
  const color=kind==="level"?fiche(key).s:kind==="defi"?key:kind==="year"?(key===2025?"gold":key===2026?"sci":"math"):"red";
  Z={kind,key,color,list:shuffle(pool).slice(0,10).map(q=>({...q,opts:shuffle(q.a)})),i:0,ans:[],pts:0};
  showQ();
}
const colorClass=()=>Z.color==="gold"||Z.color==="red"?"":Z.color;
function showQ(){
  const q=Z.list[Z.i],N=Z.list.length,L=LEVELS[q.d];Z.T=L.t;Z.fast=L.fast;
  const showSubj=Z.kind==="random"||Z.kind==="year";
  app.innerHTML=`
  <div class="qtop ${colorClass()}" style="${Z.color==="gold"?"--c:var(--gold)":Z.color==="red"?"--c:var(--red)":""}">
    <button class="x" id="quit" aria-label="${t("quit")}">${ic("x")}</button>
    <div class="qprog"><i style="width:${Math.round(Z.i/N*100)}%"></i></div>
    <span class="timer" id="tm">0:${pad(L.t)}</span></div>
  <div class="tbar" id="tb"><i id="tbi"></i></div>
  <div class="tags"><span class="tag l${q.d}">${t("lv"+q.d)} · ${L.t} s</span>${showSubj?`<span class="tag">${sname(q.s)}</span>`:""}<span class="tag">${src(q)}</span></div>
  <p class="qtext" lang="fr">${q.q}</p>
  <div class="opts" lang="fr">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${o}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  document.getElementById("quit").onclick=home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  Z.t0=performance.now();stopTimer();iv=setInterval(tick,100);tick();
}
function tick(){
  const el=(performance.now()-Z.t0)/1000,left=Math.max(0,Z.T-el),sec=Math.ceil(left);
  const tm=document.getElementById("tm"),tb=document.getElementById("tb");
  if(!tm)return;
  tm.textContent=Math.floor(sec/60)+":"+pad(sec%60);
  document.getElementById("tbi").style.width=(left/Z.T*100).toFixed(1)+"%";
  const cls=sec<=Z.T/4?"danger":sec<=Z.T/2?"warn":"";
  tm.className="timer "+cls;tb.className="tbar "+cls;
  if(left<=0)answer(null);
}
function answer(k){
  stopTimer();
  const q=Z.list[Z.i],time=(performance.now()-Z.t0)/1000;
  const ok=k!==null&&q.opts[k]===q.a[0],fast=ok&&time<Z.fast,gain=ok?10+(fast?5:0):0;
  Z.pts+=gain;Z.ans.push({q,chosen:k===null?null:q.opts[k],ok,fast});
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const kk=+b.dataset.k,o=q.opts[kk];
    if(o===q.a[0]){b.classList.add("ok");b.querySelector(".l").innerHTML=ic("check")}
    else if(kk===k){b.classList.add("ko");b.querySelector(".l").innerHTML=ic("x")}});
  document.querySelector(".qprog i").style.width=Math.round((Z.i+1)/Z.list.length*100)+"%";
  const last=Z.i===Z.list.length-1;
  document.getElementById("fb").innerHTML=`
  <div class="fbk ${ok?"good":"bad"}">
    <div class="row">${tiger(72,ok?"happy":"sad")}<div><b>${ic(ok?"check":"x")} ${ok?pick(t("good")):k===null?t("tooLate"):pick(t("bad"))}</b>
      <p class="sol">${ok?`${t("plusPts")(gain)}${fast?` · ${t("speed")}`:""}`:`${t("correct")}<span lang="fr">${q.a[0]}</span>`}</p></div></div>
    <p class="ex" lang="fr">${q.e}</p>
    <button class="b3 ${ok?"jade":""}" id="next">${last?t("seeRes"):t("next")}</button></div>`;
  const n=document.getElementById("next");n.onclick=()=>{if(last)finish();else{Z.i++;showQ()}};
  n.focus({preventScroll:true});n.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function finish(){
  const N=Z.list.length,good=Z.ans.filter(a=>a.ok).length,fastN=Z.ans.filter(a=>a.fast).length;
  const td=today(),goalBefore=todayPts()>=st.goal;
  st.points+=Z.pts;st.quizzes++;st.best=Math.max(st.best,Math.round(good/N*10));
  if(st.dayDate!==td){st.dayDate=td;st.dayPts=0}
  st.dayPts+=Z.pts;
  let streakUp=false;
  if(st.lastDay!==td){st.streak=st.lastDay===yday()?st.streak+1:1;st.lastDay=td;streakUp=true}
  Z.ans.forEach(a=>{const r=st.topics[a.q.t]||(st.topics[a.q.t]={ok:0,n:0});r.n++;if(a.ok)r.ok++});
  let stars=0,unlockedNext=null,prevStars=0;
  if(Z.kind==="level"){
    stars=starsFor(good,N);prevStars=starsOf(Z.key);
    st.levels[Z.key]={stars:Math.max(prevStars,stars)};
    const f=fiche(Z.key),fs=subjFiches(f.s),i=fs.indexOf(f);
    if(stars>=1&&prevStars===0)unlockedNext=i<fs.length-1?fs[i+1]:"defi";
  }
  const subj=Z.kind==="level"?fiche(Z.key).s:Z.kind==="defi"?Z.key:null;
  if(subj&&!st.done.includes(subj))st.done.push(subj);
  const earn=[],give=id=>{if(!st.badges.includes(id)){st.badges.push(id);earn.push(id)}};
  give("premier");
  if(fastN>=5)give("eclair");
  if(Z.kind==="random"&&good>=8)give("touche");
  if(good===N&&N>=5)give("parfait");
  if(Object.keys(SUBJ).every(s=>st.done.includes(s)))give("tour");
  if(curStreak()>=3)give("assidu");
  save();
  const errs=Z.ans.filter(a=>!a.ok),win=good/N>=.7,goalNow=st.dayPts>=st.goal;
  let advice;
  if(!errs.length)advice=t("advNone");
  else{const cnt={};errs.forEach(a=>cnt[a.q.t]=(cnt[a.q.t]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    Z.coachF=fiche(top[0]);advice=t("advErr")(top[1],Z.coachF.t)}
  const title=Z.kind==="level"?(stars>=1?t("levelWin"):t("levelFail")):win?t("quizWin"):t("quizDone");
  const nextLevel=unlockedNext&&unlockedNext!=="defi"?unlockedNext:null;
  app.innerHTML=`
  <div class="res">${win?tiger(130,"happy"):coachPic(130)}
    <h1>${title}</h1>
    ${Z.kind==="level"?`<div class="bigstars">${[1,2,3].map(n=>starSvg(stars>=n)).join("")}</div>`:""}
    ${unlockedNext?`<p class="muted">${unlockedNext==="defi"?t("defiUnl"):t("nextUnl")(unlockedNext.t)}</p>`:Z.kind==="level"&&stars===0?`<p class="muted">${t("needStar")}</p>`:""}
  </div>
  <div class="kpis">
    <div class="kpi math"><div class="h">${t("score")}</div><div class="v">${good}/${N}</div></div>
    <div class="kpi" style="--c:var(--gold-d)"><div class="h">${t("points")}</div><div class="v">+${Z.pts}</div></div>
    <div class="kpi hg"><div class="h">${t("streak")}</div><div class="v">${t("days")(st.streak)}</div></div>
  </div>
  ${streakUp?`<div class="newbadge streakbox"><span class="ic">${ic("flame")}</span><div><b>${st.streak===1?t("streakStart"):t("streakMore")}</b><br><span class="muted">${t("streakSub")(st.streak)}</span></div></div>`:""}
  <div class="goal"><div class="goal-top">${ic("target")}<span class="t">${t("goal")}</span><span class="v">${st.dayPts} / ${st.goal} ${t("pts")}</span></div>
    <div class="pbar ${goalNow?"done":""}"><i style="width:${Math.min(100,Math.round(st.dayPts/st.goal*100))}%"></i></div>
    ${goalNow&&!goalBefore?`<p style="color:var(--jade);font-weight:600">${ic("check")} ${t("goalReached")}</p>`:""}</div>
  ${earn.map(id=>{const b=BADGES.find(x=>x.id===id);return`<div class="newbadge"><span class="ic">${ic(b.i)}</span><div><b>${t("badgeUnl")(bname(id))}</b><br><span class="muted">${bdesc(id)}</span></div></div>`}).join("")}
  <div class="hero">${coachPic(70)}<div class="bubble"><span class="who">${t("coach")}</span><p>${advice}</p>${errs.length?`<button class="link" id="coachgo">${t("openFiche")}</button>`:""}</div></div>
  <div class="btns">
    ${nextLevel?`<button class="b3 ${nextLevel.s}" style="background:var(--c);box-shadow:0 5px 0 var(--cd)" id="nextlvl">${t("nextChap")}</button>`:""}
    ${errs.length?`<button class="b3 ${nextLevel?"ghost":""}" id="review">${t("reviewBtn")(errs.length)}</button>`:""}
    <button class="b3 ghost" id="again">${t("replay")}</button>
    <button class="b3 ghost" id="home">${t("backPath")}</button></div>`;
  if(nextLevel)document.getElementById("nextlvl").onclick=()=>level(nextLevel.id);
  if(errs.length){document.getElementById("review").onclick=()=>review(errs);document.getElementById("coachgo").onclick=()=>level(Z.coachF.id)}
  document.getElementById("again").onclick=()=>startQuiz(Z.kind,Z.key);
  document.getElementById("home").onclick=()=>{if(subj)st.sel=subj;home()};
}

function review(errs){
  app.innerHTML=`
  <div class="bar"><button class="round" id="back" aria-label="${t("back")}">${ic("back")}</button><span class="spacer"></span></div>
  <div class="hero">${coachPic(80)}<div class="bubble"><span class="who">${t("coach")}</span><b>${t("remember")}</b><p>${t("rememberP")}</p></div></div>
  ${errs.map(a=>`<div class="card err"><div class="tags"><span class="tag">${sname(a.q.s)} · <span lang="fr">${fiche(a.q.t).t}</span></span><span class="tag">${src(a.q)}</span></div><p style="font-weight:600" lang="fr">${a.q.q}</p>
    <p class="you">${ic("x")} ${a.chosen===null?t("timeUp"):t("yourAns")+`<span lang="fr">${a.chosen}</span>`}</p><p class="right">${ic("check")} ${t("correct")}<span lang="fr">${a.q.a[0]}</span></p><p class="ex" lang="fr">${a.q.e}</p></div>`).join("")}
  <div class="btns"><button class="b3" id="again">${t("redo")}</button><button class="b3 ghost" id="home">${t("backPath")}</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("again").onclick=()=>startQuiz(Z.kind,Z.key);
  document.getElementById("home").onclick=home;
}

splash();

</script>
</body>
</html>
