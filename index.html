<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Révise le brevet avec 115 questions d'annales 2024 et 2025, des fiches, un parcours de niveaux et des avatars à personnaliser.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Brevet.AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column of chunky, rounded game pieces; red dragon = coach, orange tiger = player's buddy */
:root{
  --bg:#F6F7FB;--card:#FFFFFF;--line:#E3E6EF;--text:#1E2433;--muted:#6B7389;--lock:#D5D9E4;--lock-d:#B8BECD;
  --red:#E63946;--red-d:#B5232F;--gold:#F5B700;--gold-d:#C98F00;--jade:#13A77F;--jade-d:#0C7C5E;
  --blue:#2F7DE1;--blue-d:#1D5BAE;--violet:#8B5CF6;--violet-d:#6A3FD0;--orange:#F28C28;--orange-d:#C76A12;
  --ok-bg:#E3F7EE;--ko-bg:#FDE8EA;--gold-bg:#FFF4CC;--on-gold:#3A2A00;
  --font:"Fredoka","Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121625;--card:#1C2133;--line:#2C3350;--text:#EEF1F8;--muted:#9AA3BC;--lock:#343B55;--lock-d:#262C42;
  --ok-bg:#12352B;--ko-bg:#3E1C22;--gold-bg:#3A3110;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121625;--card:#1C2133;--line:#2C3350;--text:#EEF1F8;--muted:#9AA3BC;--lock:#343B55;--lock-d:#262C42;
  --ok-bg:#12352B;--ko-bg:#3E1C22;--gold-bg:#3A3110;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;min-height:100%}
#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1{font-size:28px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
p{margin:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.masc{display:block;flex:none}
.muted{color:var(--muted)}
/* chunky 3D buttons */
.b3{--c:var(--red);--cd:var(--red-d);background:var(--c);color:#fff;border:none;border-radius:16px;padding:14px 18px;font-weight:600;font-size:17px;box-shadow:0 5px 0 var(--cd);transition:transform .08s,box-shadow .08s;width:100%}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.b3.gold{--c:var(--gold);--cd:var(--gold-d);color:var(--on-gold)}
.b3.jade{--c:var(--jade);--cd:var(--jade-d)}
.b3.blue{--c:var(--blue);--cd:var(--blue-d)}
.b3.ghost{--c:var(--card);--cd:var(--line);color:var(--text);border:2px solid var(--line)}
/* top bar */
.bar{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:17px;padding:6px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.chip.fire{color:var(--orange)}.chip.pts{color:var(--gold-d)}
.chip.fire.off{color:var(--muted)}
.spacer{flex:1}
.me{background:none;border:none;padding:0;border-radius:50%}
.av{display:grid;place-items:center;border-radius:50%;overflow:hidden;flex:none}
.pform{display:flex;flex-direction:column;gap:12px}
.pform input{font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.pform input:focus{outline:none;border-color:var(--blue)}
.perr{color:var(--red);font-size:14px;margin-top:-6px}
.avgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.avpick{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 4px;font-weight:600;font-size:14px;box-shadow:0 4px 0 var(--line)}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.skins{display:flex;gap:8px}
.skin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line)}
.skin.on{border-color:var(--jade);box-shadow:0 0 0 3px var(--ok-bg)}
.pform input.num{width:80px;text-align:center;font-weight:700}
.phrow{display:flex;align-items:center;gap:14px}
.phprev{width:72px;height:72px;border-radius:50%;border:3px solid var(--line);background:var(--lock);overflow:hidden;padding:0;display:grid;place-items:center;color:var(--muted);flex:none}
.phprev.on{border-color:var(--jade);box-shadow:0 0 0 4px var(--ok-bg)}
.phprev svg.i{width:34px;height:34px}
.phbtns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.phbtns .b3{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;padding:12px}
.av img,.phprev img{width:100%;height:100%;object-fit:cover;display:block}
.avpick.on{border-color:var(--jade);background:var(--ok-bg);box-shadow:0 4px 0 var(--jade)}
.round{width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
/* mascot speech */
.hero{display:flex;gap:12px;align-items:flex-end}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:22px;width:16px;height:16px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{font-size:18px}
.bubble .who{font-size:13px;color:var(--red);font-weight:600}
.link{align-self:flex-start;background:none;border:none;color:var(--blue);font-weight:600;padding:0;font-size:15px}
/* daily goal */
.goal{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;align-items:center;gap:10px}
.goal-top .t{flex:1;font-weight:600}
.goal-top .v{font-weight:700;color:var(--gold-d);font-variant-numeric:tabular-nums}
.pbar{height:16px;border-radius:999px;background:var(--lock);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--gold);transition:width .4s}
.pbar.done i{background:var(--jade)}
.goal-opts{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.goal-opts button{border:2px solid var(--line);background:none;border-radius:999px;padding:2px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.goal-opts button.on{border-color:var(--gold);background:var(--gold-bg);color:var(--text)}
/* subject tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tab{--c:var(--blue);--cd:var(--blue-d);border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 4px 0 var(--cd)}
.math{--c:var(--blue);--cd:var(--blue-d)}.fr{--c:var(--violet);--cd:var(--violet-d)}.hg{--c:var(--orange);--cd:var(--orange-d)}.sci{--c:var(--jade);--cd:var(--jade-d)}
/* unit + path */
.unit{background:var(--c);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--cd);display:flex;flex-direction:column;gap:6px}
.unit b{font-size:20px}
.unit .pbar{background:rgba(255,255,255,.3);height:10px}
.unit .pbar i{background:#fff}
.path{display:flex;flex-direction:column;gap:0;position:relative;padding-left:4px}
.lvl{display:flex;align-items:center;gap:14px;background:none;border:none;text-align:left;padding:8px 0;position:relative}
.lvl:not(:last-child)::after{content:"";position:absolute;left:33px;top:72px;width:6px;height:calc(100% - 64px);border-radius:3px;background:var(--lock)}
.lvl.done:not(:last-child)::after{background:var(--c)}
.tile{width:72px;height:72px;border-radius:24px;flex:none;display:grid;place-items:center;font-size:28px;font-weight:700;background:var(--c);color:#fff;box-shadow:0 6px 0 var(--cd);transition:transform .08s,box-shadow .08s}
.tile svg.i{width:32px;height:32px;stroke-width:3}
.lvl:active .tile{transform:translateY(4px);box-shadow:0 2px 0 var(--cd)}
.lvl.locked .tile{background:var(--lock);box-shadow:0 6px 0 var(--lock-d);color:var(--muted)}
.lvl.locked{cursor:default}
.lvl.cur .tile{outline:4px solid var(--c);outline-offset:4px}
.lvl .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.lvl .txt b{font-size:17px;line-height:1.2}
.lvl.locked .txt b{color:var(--muted)}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.here{display:inline-block;background:var(--c);color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:1px 8px;align-self:flex-start}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.lvl.cur .tile{animation:bob 1.6s ease-in-out infinite}
/* challenge cards */
.chal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chal .b3{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;font-size:15px}
.chal .b3 small{font-size:12px;font-weight:500;opacity:.9}
.chal .b3 svg.i{width:26px;height:26px}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.badge{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center}
.badge .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-d)}
.badge.locked{color:var(--muted)}
.badge.locked .ic{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-d)}
.badge.sel{border-color:var(--gold)}
.hint{font-size:14px;color:var(--muted);min-height:20px;text-align:center}
.foot{font-size:12px;color:var(--muted);text-align:center}
.reset{background:none;border:none;color:var(--muted);font-size:14px;align-self:center}
/* level page */
.lhead{background:var(--c);color:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--cd);display:flex;flex-direction:column;gap:4px}
.lhead small{font-weight:600;opacity:.9}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px}
.fiche{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.fiche li{display:flex;gap:10px;align-items:flex-start}
.fiche li::before{content:"";flex:none;width:10px;height:10px;border-radius:3px;background:var(--c);margin-top:7px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.x{background:none;border:none;color:var(--muted);padding:4px}
.x svg.i{width:26px;height:26px}
.qprog{flex:1;height:16px;border-radius:999px;background:var(--lock);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.timer{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:999px;background:var(--ok-bg);color:var(--jade-d);min-width:64px;text-align:center}
.timer.warn{background:var(--gold-bg);color:var(--gold-d)}.timer.danger{background:var(--ko-bg);color:var(--red)}
.tbar{height:6px;border-radius:3px;background:var(--lock);overflow:hidden;margin-top:-8px}
.tbar i{display:block;height:100%;width:100%;background:var(--jade);transition:width .2s linear}
.tbar.warn i{background:var(--gold)}.tbar.danger i{background:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;border-radius:10px;padding:2px 10px;background:var(--card);border:2px solid var(--line);color:var(--muted)}
.tag.l1{color:var(--jade);border-color:var(--jade)}.tag.l2{color:var(--gold-d);border-color:var(--gold)}.tag.l3{color:var(--red);border-color:var(--red)}
.qtext{font-size:21px;font-weight:600;line-height:1.3;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;font-size:17px;font-weight:500;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .l{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.opt.ok{border-color:var(--jade);background:var(--ok-bg);box-shadow:0 4px 0 var(--jade)}
.opt.ok .l{border-color:var(--jade);color:var(--jade)}
.opt.ko{border-color:var(--red);background:var(--ko-bg);box-shadow:0 4px 0 var(--red)}
.opt.ko .l{border-color:var(--red);color:var(--red)}
.opt:disabled{cursor:default}
.fbk{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.fbk.good{background:var(--ok-bg)}.fbk.bad{background:var(--ko-bg)}
.fbk .row{display:flex;gap:12px;align-items:center}
.fbk b{font-size:22px}
.fbk.good b{color:var(--jade)}.fbk.bad b{color:var(--red)}
.fbk .sol{font-weight:600}
.fbk .ex{font-size:15px}
/* result */
.res{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigstars{display:flex;gap:8px}
.bigstars svg{width:44px;height:44px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.kpi{border:2px solid var(--c);border-radius:18px;overflow:hidden;text-align:center}
.kpi .h{background:var(--c);color:#fff;font-size:13px;font-weight:600;padding:3px}
.kpi .v{font-size:24px;font-weight:700;padding:8px 4px;font-variant-numeric:tabular-nums;color:var(--c)}
.newbadge{display:flex;gap:12px;align-items:center;background:var(--gold-bg);border:2px solid var(--gold);border-radius:18px;padding:12px;width:100%;text-align:left}
.newbadge .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);flex:none}
.btns{display:flex;flex-direction:column;gap:12px}
.err{display:flex;flex-direction:column;gap:6px}
.err .you{color:var(--red)}.err .right{color:var(--jade);font-weight:600}.err .ex{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion: reduce){.lvl.cur .tile{animation:none}.b3,.opt,.tile,.tbar i,.pbar i,.qprog i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const ICONS={
bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
flag:'<path d="M5 21V4h12l-2 4 2 4H5"/>',
shuffle:'<path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>',
trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
flame:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-9-1 2-2 3-3 3 0-2-1-4-3-6 0 4-4 6-4 12 0 4 3 7 7 7z"/>',
map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',
sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const starSvg=on=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?"var(--gold)":"var(--lock)"}" stroke="${on?"var(--gold-d)":"var(--lock-d)"}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

/* ---------- Mascottes originales ---------- */
function dragon(size,mood){
  const mouth=mood==="sad"?'<path d="M50 93 Q60 86 70 93" stroke="#7A1620" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    :mood==="think"?'<path d="M52 91 Q60 94 68 90" stroke="#7A1620" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    :'<path d="M46 87 Q60 100 74 87" stroke="#7A1620" stroke-width="3.5" fill="#B5232F" stroke-linecap="round"/>';
  return `<svg class="masc" width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true">
  <path d="M40 34C31 20 34 9 44 4c-3 10 1 18 7 26z" fill="#F5B700" stroke="#C98F00" stroke-width="2"/>
  <path d="M80 34C89 20 86 9 76 4c3 10-1 18-7 26z" fill="#F5B700" stroke="#C98F00" stroke-width="2"/>
  <path d="M22 66L6 58l15-5L8 40l17 3-1-14 13 11z" fill="#13A77F"/>
  <path d="M98 66l16-8-15-5 13-13-17 3 1-14-13 11z" fill="#13A77F"/>
  <ellipse cx="60" cy="56" rx="38" ry="32" fill="#E63946"/>
  <path d="M48 30q12-8 24 0" stroke="#F5B700" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="60" cy="82" rx="30" ry="19" fill="#F2735B"/>
  <circle cx="50" cy="77" r="3" fill="#7A1620"/><circle cx="70" cy="77" r="3" fill="#7A1620"/>
  <path d="M34 ${mood==="sad"?"36":"40"} Q45 32 55 40" stroke="#F5B700" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M65 40 Q75 32 86 ${mood==="sad"?"36":"40"}" stroke="#F5B700" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="45" cy="54" r="11" fill="#fff"/><circle cx="75" cy="54" r="11" fill="#fff"/>
  <circle cx="${mood==="think"?44:47}" cy="${mood==="think"?52:56}" r="5.5" fill="#1E2433"/><circle cx="${mood==="think"?74:77}" cy="${mood==="think"?52:56}" r="5.5" fill="#1E2433"/>

function shrinkPhoto(file){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej();
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const S=160,c=document.createElement("canvas");c.width=c.height=S;const m=Math.min(img.naturalWidth,img.naturalHeight);
    c.getContext("2d").drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

{s:"math",t:"geo",y:2025,c:M,q:"Le triangle ADC est rectangle en A, avec AD = 200 m et AC = 480 m. Combien mesure CD ?",a:["520 m","680 m","440 m","500 m"],e:"Pythagore : CD² = 200² + 480² = 40 000 + 230 400 = 270 400, donc CD = 520 m."},
{s:"math",t:"geo",y:2025,c:M,q:"A, D, E et A, C, B sont alignés dans le même ordre, avec AD/AE = 200/250 et AC/AB = 480/600. Que peut-on dire de (CD) et (BE) ?",a:["Elles sont parallèles","Elles sont perpendiculaires","Elles se coupent","On ne peut rien conclure"],e:"Les deux rapports valent 0,8. D'après la réciproque du théorème de Thalès, (CD) et (BE) sont parallèles."},
{s:"math",t:"geo",y:2025,c:M,q:"Dans le triangle ADC rectangle en A, AD = 200 m et AC = 480 m. Que vaut l'angle ACD, au dixième près ?",a:["22,6°","24,6°","67,4°","20,0°"],e:"tan(ACD) = opposé ÷ adjacent = 200 ÷ 480, donc ACD ≈ 22,6°."},
{s:"math",t:"geo",y:2025,c:M,q:"Quel est le volume d'une pyramide à base rectangulaire de 7 cm sur 4 cm et de hauteur 12 cm ?",a:["112 cm³","336 cm³","168 cm³","56 cm³"],e:"V = (aire de la base × hauteur) ÷ 3 = (28 × 12) ÷ 3 = 112 cm³."},
{s:"math",t:"geo",y:2025,c:CE,q:"Le triangle TER est rectangle en R, avec TE = 7,4 cm et un angle de 39° en E. Combien mesure RE, au centième ?",a:["5,75 cm","4,66 cm","9,52 cm","11,76 cm"],e:"RE est le côté adjacent à l'angle E et TE l'hypoténuse : RE = 7,4 × cos(39°) ≈ 5,75 cm."},
{s:"math",t:"geo",y:2025,c:CE,q:"Le triangle ABC est rectangle en B, avec AB = 600 m et BC = 450 m. Combien mesure AC ?",a:["750 m","1 050 m","800 m","700 m"],e:"AC² = 600² + 450² = 360 000 + 202 500 = 562 500, donc AC = 750 m."},
{s:"math",t:"geo",y:2025,c:AN,q:"On agrandit un polygone d'aire 7,5 cm² avec un coefficient 2,5. Quelle est la nouvelle aire ?",a:["46,875 cm²","18,75 cm²","37,5 cm²","15 cm²"],e:"Les longueurs sont multipliées par 2,5, donc les aires par 2,5² = 6,25 : 7,5 × 6,25 = 46,875 cm²."},
{s:"math",t:"geo",y:2024,c:M,q:"Le triangle ABD est inscrit dans un cercle et [AB] est un diamètre. Que peut-on dire de ce triangle ?",a:["Il est rectangle en D","Il est équilatéral","Il est isocèle en D","Il est rectangle en A"],e:"Un triangle inscrit dans un cercle dont un côté est un diamètre est rectangle au troisième sommet. Vérification : 5,4² + 7,2² = 81 = 9²."},
{s:"math",t:"geo",y:2024,c:M,q:"(BD) et (EF) sont parallèles, avec AE = 2,7 cm, AB = 9 cm et AD = 7,2 cm. Combien mesure AF ?",a:["2,16 cm","2,4 cm","3,6 cm","1,8 cm"],e:"Thalès : AF/AD = AE/AB, donc AF = 7,2 × 2,7 ÷ 9 = 2,16 cm."},
{s:"math",t:"geo",y:2024,c:M,q:"Quelle est l'aire d'un disque de rayon 4,5 cm, arrondie au centième ?",a:["63,62 cm²","28,27 cm²","20,25 cm²","254,47 cm²"],e:"A = π × r² = π × 4,5² = π × 20,25 ≈ 63,62 cm²."},
{s:"math",t:"geo",y:2024,c:AN,q:"Si on multiplie toutes les longueurs d'une figure par 3, son aire est multipliée par :",a:["9","3","6","27"],e:"Pour un agrandissement de rapport k, les aires sont multipliées par k² = 9 et les volumes par k³ = 27."},

{s:"math",t:"nombres",y:2025,c:M,q:"3 melons coûtent 8,40 €. Combien coûtent 5 melons ?",a:["14 €","13,40 €","12,60 €","16,80 €"],e:"1 melon coûte 8,40 ÷ 3 = 2,80 €, donc 5 melons coûtent 5 × 2,80 = 14 €."},
{s:"math",t:"nombres",y:2025,c:M,q:"Un article à 350 € augmente de 20 %. Quel est son nouveau prix ?",a:["420 €","370 €","280 €","700 €"],e:"Augmenter de 20 %, c'est multiplier par 1,2 : 350 × 1,2 = 420 €."},
{s:"math",t:"nombres",y:2025,c:CE,q:"Quelle est la décomposition en facteurs premiers de 120 ?",a:["2³ × 3 × 5","2² × 30","4 × 5 × 6","2 × 3 × 4 × 5"],e:"120 = 2 × 2 × 2 × 3 × 5 = 2³ × 3 × 5. Les autres écritures contiennent des nombres non premiers (4, 6, 30)."},
{s:"math",t:"nombres",y:2025,c:AN,q:"Un article à 25 € subit une hausse de 14 %. Quel est son nouveau prix ?",a:["28,50 €","39 €","25,14 €","21,50 €"],e:"25 × 1,14 = 28,50 €."},
{s:"math",t:"nombres",y:2025,c:AN,q:"Quelle est la décomposition en facteurs premiers de 1 050 ?",a:["2 × 3 × 5² × 7","2 × 3² × 5 × 7","2 × 5 × 105","2² × 3 × 5 × 7"],e:"1 050 = 2 × 525 = 2 × 3 × 175 = 2 × 3 × 5 × 35 = 2 × 3 × 5² × 7."},
{s:"math",t:"nombres",y:2025,c:AS,q:"Baisser un prix de 70 %, c'est le multiplier par :",a:["0,3","0,7","1,7","−0,7"],e:"On garde 100 % − 70 % = 30 % du prix, donc on multiplie par 0,3."},
{s:"math",t:"nombres",y:2025,c:AS,q:"On répartit 300 poissons d'un type et 350 d'un autre en lots identiques, sans reste. Combien de lots au maximum ?",a:["50","25","10","70"],e:"300 = 2² × 3 × 5² et 350 = 2 × 5² × 7. Leur plus grand diviseur commun est 2 × 5² = 50."},
{s:"math",t:"nombres",y:2025,c:AS,q:"Un article à 55 € bénéficie d'une réduction de 15 %. Quel est son prix ?",a:["46,75 €","40 €","8,25 €","63,25 €"],e:"Une baisse de 15 % revient à multiplier par 0,85 : 55 × 0,85 = 46,75 €."},
{s:"math",t:"nombres",y:2024,c:M,q:"Combien vaut (−5)³ ?",a:["−125","−15","125","15"],e:"(−5) × (−5) × (−5) = 25 × (−5) = −125."},
{s:"math",t:"nombres",y:2024,c:M,q:"Avec 330 autocollants et 132 drapeaux, combien de sachets identiques au maximum peut-on faire en utilisant tout ?",a:["66","33","22","132"],e:"330 = 2 × 3 × 5 × 11 et 132 = 2² × 3 × 11. Plus grand diviseur commun : 2 × 3 × 11 = 66, avec 5 autocollants et 2 drapeaux par sachet."},
{s:"math",t:"nombres",y:2024,c:M,q:"Une piscine de 25 m × 15 m × 2 m est remplie aux 9/10. L'eau coûte 4,14 € le m³. Combien coûte le remplissage ?",a:["2 794,50 €","3 105 €","2 794,05 €","675 €"],e:"Volume : 25 × 15 × 2 = 750 m³. Aux 9/10 : 675 m³. Coût : 675 × 4,14 = 2 794,50 €."},
{s:"math",t:"nombres",y:2024,c:CE,q:"Deux circuits se parcourent en 280 s et 350 s. Deux coureurs partent ensemble : quand se retrouvent-ils au départ ?",a:["Après 1 400 s","Après 630 s","Après 70 s","Après 700 s"],e:"280 = 2³ × 5 × 7 et 350 = 2 × 5² × 7. Plus petit multiple commun : 2³ × 5² × 7 = 1 400 s, soit 23 min 20 s."},

{s:"math",t:"alg",y:2025,c:M,q:"Quelle est la forme développée et réduite de (2x + 3)(x − 4) ?",a:["2x² − 5x − 12","2x² − 12","2x² + 11x − 12","2x² − 8x + 3"],e:"2x × x − 2x × 4 + 3 × x − 3 × 4 = 2x² − 8x + 3x − 12 = 2x² − 5x − 12."},
{s:"math",t:"alg",y:2025,c:M,q:"Programme : choisir un nombre, soustraire 4, multiplier par 2, ajouter 8. Que obtient-on toujours ?",a:["Le double du nombre de départ","Le nombre de départ","Le nombre de départ + 4","Toujours 8"],e:"(x − 4) × 2 + 8 = 2x − 8 + 8 = 2x."},
{s:"math",t:"alg",y:2025,c:M,q:"Un programme donne 20x + 50. Quel nombre de départ donne 75 ?",a:["1,25","5","2,5","1,5"],e:"20x + 50 = 75, donc 20x = 25 et x = 1,25."},
{s:"math",t:"alg",y:2025,c:M,q:"Acheter : 22 400 € puis 75 € par mois. Louer : 425 € par mois. À partir de quel mois l'achat est-il plus avantageux ?",a:["Le 65e mois","Le 53e mois","Le 64e mois","Le 36e mois"],e:"425x > 22 400 + 75x donne 350x > 22 400, donc x > 64 : l'achat devient avantageux à partir du 65e mois."},
{s:"math",t:"alg",y:2025,c:CE,q:"Programme : multiplier par −2, ajouter 4, multiplier par 4. Quel résultat avec −2 ?",a:["32","0","−32","16"],e:"−2 × (−2) = 4 ; 4 + 4 = 8 ; 8 × 4 = 32. En général, le résultat vaut −8x + 16."},
{s:"math",t:"alg",y:2025,c:CE,q:"Quelle est la solution de −8x + 16 = 4 ?",a:["x = 1,5","x = 2,5","x = −1,5","x = 0,5"],e:"−8x = 4 − 16 = −12, donc x = −12 ÷ (−8) = 1,5."},
{s:"math",t:"alg",y:2025,c:CE,q:"Quelle est la forme factorisée de 4x² − 1 ?",a:["(2x − 1)(2x + 1)","(4x − 1)(4x + 1)","4(x − 1)(x + 1)","(2x − 1)²"],e:"C'est l'identité a² − b² = (a − b)(a + b), avec a = 2x et b = 1."},
{s:"math",t:"alg",y:2025,c:CE,q:"Dans un tableur, A1 contient 5 et A2 contient =−4*A1−12. Quelle valeur affiche A2 ?",a:["−32","−8","8","−20"],e:"−4 × 5 − 12 = −20 − 12 = −32."},
{s:"math",t:"alg",y:2024,c:M,q:"f(x) = 3x − 2. Quelle est l'image de −4 ?",a:["−14","−10","−3","10"],e:"f(−4) = 3 × (−4) − 2 = −12 − 2 = −14."},
{s:"math",t:"alg",y:2024,c:M,q:"Un programme donne (x + 2)(x − 1). Quel résultat avec −9 ?",a:["70","−70","88","−88"],e:"(−9 + 2) × (−9 − 1) = (−7) × (−10) = 70."},
{s:"math",t:"alg",y:2024,c:M,q:"Le programme A donne 2x² + 2x − 4 et le programme B donne (x + 2)(x − 1). Quel lien existe entre eux ?",a:["A est toujours le double de B","A et B sont toujours égaux","B est toujours le double de A","Aucun lien"],e:"(x + 2)(x − 1) = x² + x − 2, et 2(x² + x − 2) = 2x² + 2x − 4 : A = 2 × B."},
{s:"math",t:"alg",y:2024,c:CE,q:"Quelle est la forme factorisée de x² − x − 2 ?",a:["(x − 2)(x + 1)","(x + 2)(x − 1)","(x − 1)²","(x − 2)(x − 1)"],e:"(x − 2)(x + 1) = x² + x − 2x − 2 = x² − x − 2. L'équation x² − x − 2 = 0 a donc pour solutions 2 et −1."},
{s:"math",t:"alg",y:2024,c:AS,q:"Quelle est la forme factorisée de 4x² − 9 ?",a:["(2x − 3)(2x + 3)","(4x − 3)(4x + 3)","(2x − 3)²","(2x − 9)(2x + 1)"],e:"a² − b² = (a − b)(a + b), avec a = 2x et b = 3."},
{s:"math",t:"alg",y:2024,c:PO,q:"f(x) = (x + 2)² − x. Combien vaut f(−4) ?",a:["8","0","−8","40"],e:"(−4 + 2)² − (−4) = (−2)² + 4 = 4 + 4 = 8."},

{s:"math",t:"stats",y:2025,c:CE,q:"Cinq colis pèsent 4, 9, 2, 7 et 11 kg. Quelle est leur masse moyenne ?",a:["6,6 kg","7 kg","6 kg","5,5 kg"],e:"(4 + 9 + 2 + 7 + 11) ÷ 5 = 33 ÷ 5 = 6,6 kg."},
{s:"math",t:"stats",y:2025,c:CE,q:"Quelle est la médiane des masses 4, 9, 2, 7 et 11 kg ?",a:["7 kg","2 kg","6,6 kg","9 kg"],e:"Dans l'ordre : 2, 4, 7, 9, 11. La valeur du milieu est 7 kg."},
{s:"math",t:"stats",y:2025,c:AS,q:"Quelle est l'étendue de la série 7, 18, 12, 13, 15 ?",a:["11","13","18","25"],e:"Étendue = 18 − 7 = 11. La médiane et la moyenne valent toutes les deux 13."},
{s:"math",t:"stats",y:2024,c:M,q:"Sept élèves mesurent 1,46 ; 1,65 ; 1,6 ; 1,72 ; 1,7 ; 1,67 et 1,75 m. Quelle est la médiane ?",a:["1,67 m","1,72 m","1,65 m","1,7 m"],e:"Dans l'ordre : 1,46 ; 1,6 ; 1,65 ; 1,67 ; 1,7 ; 1,72 ; 1,75. La 4e valeur, au milieu, est 1,67 m."},

/* ----- FRANÇAIS ----- */
{s:"fr",t:"oeuvres",y:2025,c:M,q:"Le texte de 2025 est tiré de La Force de l'âge (1960). Qui en est l'auteure ?",a:["Simone de Beauvoir","Marguerite Duras","Annie Ernaux","George Sand"],e:"Simone de Beauvoir y raconte sa propre vie de jeune professeure."},
{s:"fr",t:"oeuvres",y:2025,c:M,q:"Dans La Force de l'âge, l'auteure raconte sa propre vie. C'est donc :",a:["Une autobiographie","Un roman d'aventures","Une fable","Une pièce de théâtre"],e:"Dans une autobiographie, l'auteur, le narrateur et le personnage principal sont la même personne."},
{s:"fr",t:"oeuvres",y:2025,c:M,q:"Pourquoi la narratrice arrive-t-elle à Marseille dans l'extrait de 2025 ?",a:["Pour enseigner dans un lycée","Pour y passer des vacances","Pour retrouver sa famille","Pour étudier à l'université"],e:"Elle est nommée professeure au lycée, avec quatorze heures de cours par semaine."},
{s:"fr",t:"oeuvres",y:2025,c:M,q:"Quel tableau accompagnait le texte de 2025 ?",a:["La Robe rose de Frédéric Bazille","Les Coquelicots de Claude Monet","Le Déjeuner sur l'herbe de Manet","La Liberté guidant le peuple de Delacroix"],e:"La Robe rose (1864) montre une jeune femme de dos face à un village ensoleillé, comme la narratrice face à Marseille."},
{s:"fr",t:"oeuvres",y:2024,c:M,q:"Le texte de 2024 montre des officiers défigurés soignés au Val-de-Grâce. Pendant quelle guerre ont-ils été blessés ?",a:["La Première Guerre mondiale","La Seconde Guerre mondiale","La guerre d'Algérie","La guerre de 1870"],e:"Il est extrait de La Chambre des officiers de Marc Dugain, sur les blessés de 1914-1918."},
{s:"fr",t:"oeuvres",y:2024,c:M,q:"Comment appelle-t-on les soldats défigurés de la guerre de 1914-1918 ?",a:["Les gueules cassées","Les embusqués","Les réformés","Les planqués"],e:"Les embusqués et les réformés, cités dans le texte, sont au contraire des hommes qui n'ont pas combattu au front."},
{s:"fr",t:"style",y:2025,c:M,q:"La narratrice dit avoir eu « le coup de foudre » pour une ville. Quelle figure de style ?",a:["Une métaphore","Une comparaison","Une hyperbole","Une antithèse"],e:"Une expression amoureuse est appliquée à une ville, sans outil de comparaison : c'est une métaphore."},
{s:"fr",t:"style",y:2025,c:M,q:"La narratrice répète « je » en tête de phrase pour énumérer ses découvertes. Comment s'appelle cette répétition ?",a:["Une anaphore","Une litote","Une personnification","Un oxymore"],e:"L'anaphore répète un mot en début de phrases. Avec l'énumération, elle traduit une exploration rapide et joyeuse."},
{s:"fr",t:"style",y:2024,c:M,q:"« Un parterre de roses saccagé par le milieu » oppose la beauté d'un visage à sa blessure. Quelle figure selon le corrigé ?",a:["Une antithèse","Une anaphore","Une litote","Une hyperbole"],e:"L'antithèse rapproche deux idées opposées : ici la beauté et l'horreur."},
{s:"fr",t:"gram",y:2025,c:M,q:"Dans le texte, « séparée » se termine par -ée. Pourquoi ?",a:["Il s'accorde au féminin avec « je », la narratrice","C'est un verbe à l'infinitif","Il s'accorde avec le nom « passé »","C'est une erreur de l'auteure"],e:"C'est un participe employé comme adjectif, en apposition au sujet « je » : la narratrice est une femme."},
{s:"fr",t:"gram",y:2025,c:M,q:"« J'avais rendu visite à la directrice, mon emploi du temps était fixé. » Comment ces propositions sont-elles reliées ?",a:["Elles sont juxtaposées","Elles sont coordonnées","La seconde est subordonnée","Elles sont relatives"],e:"Une virgule, sans mot de liaison : c'est la juxtaposition. Avec « et » ou « mais », elles seraient coordonnées."},
{s:"fr",t:"gram",y:2025,c:M,q:"À quel temps est conjugué « je m'immobilisai » ?",a:["Passé simple","Imparfait","Passé composé","Futur simple"],e:"Terminaison -ai d'un verbe du 1er groupe au passé simple. À l'imparfait, on écrirait « je m'immobilisais »."},
{s:"fr",t:"gram",y:2025,c:M,q:"Comment est formé le verbe « immobiliser » ?",a:["im- + mobil- + -iser","immo- + -biliser","immobil- sans préfixe","imm- + -obiliser"],e:"Préfixe im- (négation), radical mobil-, suffixe -iser : rendre non mobile. Même famille : mobile, mobilité, immobilité."},
{s:"fr",t:"gram",y:2025,c:M,q:"Dans la réécriture au pluriel, pourquoi le participe « dépendu » (avec avoir) reste-t-il invariable ?",a:["Aucun COD n'est placé avant le verbe","Le sujet est masculin","Le verbe est au présent","Il ne s'accorde jamais"],e:"Avec l'auxiliaire avoir, le participe passé s'accorde seulement avec un COD placé avant lui."},
{s:"fr",t:"gram",y:2024,c:M,q:"Dans le texte de 2024, l'expansion « d'officiers » complète un nom. Quelle est sa nature ?",a:["Un groupe nominal prépositionnel","Une proposition relative","Un adjectif","Un adverbe"],e:"Introduit par la préposition « de », ce groupe nominal est un complément du nom."},
{s:"fr",t:"gram",y:2024,c:M,q:"« … qui compte à ce jour trois membres actifs » complète un nom. Quelle est sa nature ?",a:["Une proposition subordonnée relative","Un complément du nom","Une proposition indépendante","Un adjectif épithète"],e:"Elle commence par le pronom relatif « qui » : c'est une subordonnée relative."},
{s:"fr",t:"gram",y:2024,c:M,q:"« Je compris aussitôt que ni Weil ni moi ne pourrions nous entretenir avec elle. » Fonction de la subordonnée ?",a:["COD du verbe « compris »","Sujet","Complément circonstanciel de temps","Complément du nom"],e:"Je compris quoi ? La subordonnée introduite par « que » répond : elle est COD."},
{s:"fr",t:"gram",y:2024,c:M,q:"Dans « insupportable », que signifient le préfixe in- et le suffixe -able ?",a:["in- : négation ; -able : possibilité","in- : intérieur ; -able : agréable","in- : intensité ; -able : action","in- : répétition ; -able : objet"],e:"Insupportable : qu'on ne peut pas supporter. Synonymes : inacceptable, inadmissible."},
{s:"fr",t:"epreuve",y:2025,c:M,q:"Quelle partie de l'épreuve de français rapporte le plus de points ?",a:["Grammaire et compréhension","La dictée","La rédaction","Elles valent toutes autant"],e:"Grammaire et compréhension : 50 points en 1 h 10. Rédaction : 40 points en 1 h 30. Dictée : 10 points en 20 min."},
{s:"fr",t:"epreuve",y:2025,c:M,q:"Sur quoi portait le sujet de réflexion de 2025 ?",a:["La littérature et les arts qui font découvrir des lieux","Le rôle des réseaux sociaux","L'utilité du sport à l'école","Les dangers de la guerre"],e:"Les arts permettent-ils de découvrir des lieux réels ou fictifs comme si l'on y était ? L'autre sujet demandait une lettre de la narratrice à ses parents."},

/* ----- HISTOIRE-GÉO / EMC ----- */
{s:"hg",t:"ww2",y:2024,c:M,q:"Dans quel pays se trouvait le camp d'Auschwitz-Birkenau ?",a:["En Pologne","En Allemagne","En Autriche","En France"],e:"Auschwitz-Birkenau, en Pologne occupée, était à la fois un camp de concentration et un centre de mise à mort."},
{s:"hg",t:"ww2",y:2024,c:M,q:"Le document de 2024 était un témoignage de Ginette Kolinka. Qui est-elle ?",a:["Une rescapée d'Auschwitz-Birkenau","Une résistante à Londres","Une infirmière de 1914-1918","Une ministre de la Ve République"],e:"Née en 1925, déportée à Auschwitz-Birkenau, elle a témoigné toute sa vie de la Shoah."},
{s:"hg",t:"ww2",y:2024,c:M,q:"Que faisaient les SS à l'arrivée des trains à Auschwitz-Birkenau ?",a:["Ils triaient les déportés : travail forcé ou chambres à gaz","Ils libéraient les enfants","Ils soignaient les malades","Ils renvoyaient les femmes chez elles"],e:"C'est la « sélection » : les personnes jugées inaptes au travail, dont les enfants, étaient assassinées dès leur arrivée."},
{s:"hg",t:"ww2",y:2024,c:M,q:"Qui étaient les kapos dans les camps ?",a:["Des détenus chargés d'encadrer les autres prisonniers","Des officiers de l'armée allemande","Des médecins de la Croix-Rouge","Des résistants infiltrés"],e:"Les kapos étaient eux-mêmes prisonniers. La Gestapo, elle, était la police politique nazie."},
{s:"hg",t:"ww2",y:2024,c:M,q:"Comment les nazis appelaient-ils leur plan d'extermination des Juifs d'Europe ?",a:["La « Solution finale »","L'« Anschluss »","Le « Blitzkrieg »","La « Collaboration »"],e:"La Solution finale a causé la mort d'environ six millions de Juifs : c'est la Shoah."},
{s:"hg",t:"ww2",y:2024,c:M,q:"Combien de Juifs ont été assassinés pendant la Shoah ?",a:["Environ 6 millions","Environ 600 000","Environ 1 million","Environ 20 millions"],e:"Environ six millions de Juifs d'Europe ont été assassinés par les nazis et leurs complices."},
{s:"hg",t:"monde",y:2025,c:M,q:"En quelle année l'Algérie devient-elle une colonie française ?",a:["1830","1870","1914","1954"],e:"La conquête commence en 1830. L'Algérie reste française jusqu'en 1962."},
{s:"hg",t:"monde",y:2025,c:M,q:"Quel mouvement déclenche l'insurrection de 1954 en Algérie ?",a:["Le FLN","L'OAS","Le CNR","L'ONU"],e:"Le Front de libération nationale (FLN) lance la guerre d'indépendance le 1er novembre 1954."},
{s:"hg",t:"monde",y:2025,c:M,q:"Quels accords mettent fin à la guerre d'Algérie en 1962 ?",a:["Les accords d'Évian","Les accords de Munich","Le traité de Rome","Les accords de Genève"],e:"Signés en mars 1962, ils conduisent à l'indépendance de l'Algérie et à la fin de l'empire colonial français."},
{s:"hg",t:"monde",y:2025,c:M,q:"Repère tombé en 2025 : en quelle année est créée l'ONU ?",a:["1945","1919","1957","1989"],e:"L'ONU est créée en 1945, à la fin de la Seconde Guerre mondiale, pour maintenir la paix."},
{s:"hg",t:"monde",y:2025,c:M,q:"Repère tombé en 2025 : en quelle année est signé le traité de Rome ?",a:["1957","1945","1992","1962"],e:"Le traité de Rome crée la Communauté économique européenne (CEE) avec 6 pays."},
{s:"hg",t:"monde",y:2025,c:M,q:"Repère tombé en 2025 : en quelle année tombe le mur de Berlin ?",a:["1989","1961","1991","1945"],e:"Construit en 1961, le mur tombe le 9 novembre 1989. L'URSS disparaît en 1991."},

const subjFiches=s=>FICHES.filter(f=>f.s===s);
const starsOf=id=>(st.levels[id]||{}).stars||0;
function levelState(s){
  const fs=subjFiches(s);let cur=null;
  const list=fs.map((f,i)=>{const stars=starsOf(f.id),open=i===0||starsOf(fs[i-1].id)>=1;
    const state=stars>=1?"done":open?"open":"locked";if(state==="open"&&!cur)cur=f.id;return{f,i,stars,state}});
  const allDone=list.every(l=>l.state==="done");
  return{list,cur:cur||(allDone?"defi":null),allDone};
}
function starsFor(good,n){const p=good/n;return p===1?3:p>=.85?2:p>=.7?1:0}

function coachAdvice(){
  if(st.quizzes===0)return{msg:"Je suis Long, ton coach. Commence par le premier niveau de maths : lis la fiche, puis joue !"};
  let worst=null;
  FICHES.forEach(f=>{const r=st.topics[f.id];if(!r||r.n<2)return;const err=r.n-r.ok,ratio=err/r.n;if(err>0&&(!worst||ratio>worst.ratio))worst={f,ratio,err,n:r.n}});
  if(!worst||worst.ratio<.25)return{msg:"Aucun point faible net pour l'instant. Avance sur ton parcours ou tente un brevet complet."};
  return{msg:`Tu rates souvent « ${worst.f.t} » (${plural(worst.err,"erreur")} sur ${worst.n}). Relis la fiche avec moi ?`,f:worst.f};
}

  if(!st.name)return profile(true);
  const c=coachAdvice(),dp=todayPts(),gp=Math.min(100,Math.round(dp/st.goal*100));
  const L=levelState(st.sel),fs=L.list,doneN=fs.filter(l=>l.state==="done").length;
  app.innerHTML=`
  ${topBar()}
  <div class="hero">${dragon(96,"happy")}
    <div class="bubble"><span class="who">Long, ton coach</span><b>Salut ${esc(st.name)} !</b><p>${c.msg}</p>${c.f?`<button class="link" id="coachgo">Ouvrir la fiche</button>`:""}</div></div>
  <div class="goal">
    <div class="goal-top">${ic("target")}<span class="t">Objectif du jour</span><span class="v">${dp} / ${st.goal} pts</span></div>
    <div class="pbar ${dp>=st.goal?"done":""}"><i style="width:${gp}%"></i></div>
    <div class="goal-opts">${dp>=st.goal?"Objectif atteint, bravo ! ":""}Changer :${GOALS.map(g=>`<button data-g="${g}" class="${g===st.goal?"on":""}">${g}</button>`).join("")}</div>
  </div>
  <div class="tabs">${Object.entries(SUBJ).map(([k,v])=>`<button class="tab ${k} ${k===st.sel?"on":""}" data-s="${k}">${v.n}</button>`).join("")}</div>
  <div class="unit ${st.sel}"><b>${SUBJ[st.sel].n}</b><span>${doneN} / ${fs.length} chapitres réussis · ${count(q=>q.s===st.sel)} questions</span>
    <div class="pbar"><i style="width:${Math.round(doneN/fs.length*100)}%"></i></div></div>
  <div class="path ${st.sel}">
    ${fs.map(l=>`<button class="lvl ${l.state} ${L.cur===l.f.id?"cur":""}" data-f="${l.f.id}" ${l.state==="locked"?'aria-disabled="true"':""}>
      <span class="tile">${l.state==="done"?ic("check"):l.state==="locked"?ic("lock"):l.i+1}</span>
      <span class="txt">${L.cur===l.f.id?'<span class="here">À toi de jouer</span>':""}<b>${l.f.t}</b>
      <span class="stars">${[1,2,3].map(n=>starSvg(l.stars>=n)).join("")}</span></span></button>`).join("")}
    <button class="lvl ${L.allDone?"open":"locked"} ${L.cur==="defi"?"cur":""}" id="defi">
      <span class="tile">${L.allDone?ic("trophy"):ic("lock")}</span>
      <span class="txt">${L.cur==="defi"?'<span class="here">Dernière étape</span>':""}<b>Défi ${SUBJ[st.sel].n}</b><span class="muted">${L.allDone?"10 questions de tous les chapitres":"Réussis tous les chapitres pour le débloquer"}</span></span></button>
  </div>
  <h2>Épreuves</h2>
  <div class="chal">
    <button class="b3" id="random">${ic("shuffle")}Aléatoire<small>Tout mélangé</small></button>
    <button class="b3 gold" data-y="2025">${ic("cal")}Brevet 2025<small>${count(q=>q.y===2025)} questions</small></button>
    <button class="b3 blue" data-y="2024">${ic("cal")}Brevet 2024<small>${count(q=>q.y===2024)} questions</small></button>
  </div>
  <h2>Badges · ${st.badges.length}/${BADGES.length}</h2>
  <div class="badges">${BADGES.map(b=>{const has=st.badges.includes(b.id);return`<button class="badge ${has?"":"locked"} ${hintBadge===b.id?"sel":""}" data-b="${b.id}"><span class="ic">${ic(has?b.i:"lock")}</span>${b.n}</button>`}).join("")}</div>
  <p class="hint">${hintBadge?(()=>{const b=BADGES.find(x=>x.id===hintBadge);return(st.badges.includes(b.id)?"Débloqué : ":"À débloquer : ")+b.d})():"Touche un badge pour savoir comment le gagner."}</p>
  <div id="resetzone" style="display:flex;justify-content:center"><button class="reset" id="reset">Remettre ma progression à zéro</button></div>
  <p class="foot">${QUESTIONS.length} questions et ${FICHES.length} fiches adaptées des sujets officiels du brevet 2024 et 2025.</p>`;
  bindTheme();
  if(c.f)document.getElementById("coachgo").onclick=()=>level(c.f.id);
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{st.goal=+b.dataset.g;save();home()});
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{st.sel=b.dataset.s;save();home()});
  app.querySelectorAll(".lvl[data-f]").forEach(b=>b.onclick=()=>{if(!b.classList.contains("locked"))level(b.dataset.f)});
  document.getElementById("defi").onclick=()=>{if(L.allDone)startQuiz("defi",st.sel)};
  document.getElementById("random").onclick=()=>startQuiz("random",null);
  app.querySelectorAll(".chal [data-y]").forEach(b=>b.onclick=()=>startQuiz("year",+b.dataset.y));
  app.querySelectorAll(".badge").forEach(b=>b.onclick=()=>{hintBadge=b.dataset.b;home()});
  document.getElementById("reset").onclick=()=>{document.getElementById("resetzone").innerHTML=`<div class="btns" style="width:100%"><button class="b3 ghost" id="no">Annuler</button><button class="b3" id="yes">Tout effacer</button></div>`;
    document.getElementById("no").onclick=home;document.getElementById("yes").onclick=()=>{const k={theme:st.theme,name:st.name,avatar:st.avatar,skin:st.skin,num:st.num,photo:st.photo};st=Object.assign(fresh(),k);save();hintBadge=null;home()}};
}

function level(id){
  stopTimer();
  const f=fiche(id),fs=subjFiches(f.s),i=fs.indexOf(f),n=Math.min(10,count(q=>q.t===id)),s=starsOf(id);
  app.innerHTML=`
  <div class="bar"><button class="round" id="back" aria-label="Retour">${ic("back")}</button><span class="spacer"></span><span class="stars">${[1,2,3].map(k=>starSvg(s>=k)).join("")}</span></div>
  <div class="lhead ${f.s}"><small>${SUBJ[f.s].n} · Chapitre ${i+1}</small><h1>${f.t}</h1></div>
  <div class="hero">${dragon(80,"think")}<div class="bubble"><span class="who">Long, ton coach</span><p>Lis la fiche, puis lance le niveau. Avec 70 % de bonnes réponses, tu gagnes une étoile et tu débloques la suite.</p></div></div>
  <div class="card ${f.s}"><ul class="fiche">${f.p.map(x=>`<li><span>${x}</span></li>`).join("")}</ul></div>
  <button class="b3 tabfix ${f.s}" id="go" style="background:var(--c);box-shadow:0 5px 0 var(--cd)">Commencer · ${plural(n,"question")}</button>`;
  document.getElementById("back").onclick=()=>{st.sel=f.s;home()};
  document.getElementById("go").onclick=()=>startQuiz("level",id);
}

let Z=null,iv=null;
function stopTimer(){clearInterval(iv);iv=null}
function startQuiz(kind,key){
  const pool=kind==="level"?QUESTIONS.filter(q=>q.t===key):kind==="defi"?QUESTIONS.filter(q=>q.s===key):kind==="year"?QUESTIONS.filter(q=>q.y===key):QUESTIONS;
  const color=kind==="level"?fiche(key).s:kind==="defi"?key:kind==="year"?(key===2025?"gold":"math"):"red";
  Z={kind,key,color,list:shuffle(pool).slice(0,10).map(q=>({...q,opts:shuffle(q.a)})),i:0,ans:[],pts:0};
  showQ();
}
const colorClass=()=>Z.color==="gold"?"":Z.color==="red"?"":Z.color;
function showQ(){
  const q=Z.list[Z.i],N=Z.list.length,L=LEVELS[q.d];Z.T=L.t;Z.fast=L.fast;
  const showSubj=Z.kind==="random"||Z.kind==="year";
  app.innerHTML=`
  <div class="qtop ${colorClass()}" style="${Z.color==="gold"?"--c:var(--gold)":Z.color==="red"?"--c:var(--red)":""}">
    <button class="x" id="quit" aria-label="Quitter">${ic("x")}</button>
    <div class="qprog"><i style="width:${Math.round(Z.i/N*100)}%"></i></div>
    <span class="timer" id="tm">0:${pad(L.t)}</span></div>
  <div class="tbar" id="tb"><i id="tbi"></i></div>
  <div class="tags"><span class="tag l${q.d}">${L.n} · ${L.t} s</span>${showSubj?`<span class="tag">${SUBJ[q.s].n}</span>`:""}<span class="tag">${src(q)}</span></div>
  <p class="qtext">${q.q}</p>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${"ABCD"[k]}</span><span>${o}</span></button>`).join("")}</div>
  <div id="fb"></div>`;
  document.getElementById("quit").onclick=home;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  Z.t0=performance.now();stopTimer();iv=setInterval(tick,100);tick();
}
function tick(){
  const el=(performance.now()-Z.t0)/1000,left=Math.max(0,Z.T-el),sec=Math.ceil(left);
  const tm=document.getElementById("tm"),tb=document.getElementById("tb");
  if(!tm)return;
  tm.textContent=Math.floor(sec/60)+":"+pad(sec%60);
  document.getElementById("tbi").style.width=(left/Z.T*100).toFixed(1)+"%";
  const cls=sec<=Z.T/4?"danger":sec<=Z.T/2?"warn":"";
  tm.className="timer "+cls;tb.className="tbar "+cls;
  if(left<=0)answer(null);
}
function answer(k){
  stopTimer();
  const q=Z.list[Z.i],time=(performance.now()-Z.t0)/1000;
  const ok=k!==null&&q.opts[k]===q.a[0],fast=ok&&time<Z.fast,gain=ok?10+(fast?5:0):0;
  Z.pts+=gain;Z.ans.push({q,chosen:k===null?null:q.opts[k],ok,fast});
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const o=q.opts[+b.dataset.k];if(o===q.a[0])b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("ko")});
  document.querySelector(".qprog i").style.width=Math.round((Z.i+1)/Z.list.length*100)+"%";
  const last=Z.i===Z.list.length-1;
  document.getElementById("fb").innerHTML=`
  <div class="fbk ${ok?"good":"bad"}">
    <div class="row">${tiger(72,ok?"happy":"sad")}<div><b>${ok?pick(GOOD):k===null?"Trop tard !":pick(BAD)}</b>
      <p class="sol">${ok?`+${gain} points${fast?` · bonus vitesse`:""}`:`Bonne réponse : ${q.a[0]}`}</p></div></div>
    <p class="ex">${q.e}</p>
    <button class="b3 ${ok?"jade":""}" id="next">${last?"Voir mon résultat":"Continuer"}</button></div>`;
  const n=document.getElementById("next");n.onclick=()=>{if(last)finish();else{Z.i++;showQ()}};
  n.focus({preventScroll:true});n.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function finish(){
  const N=Z.list.length,good=Z.ans.filter(a=>a.ok).length,fastN=Z.ans.filter(a=>a.fast).length;
  const t=today(),goalBefore=todayPts()>=st.goal;
  st.points+=Z.pts;st.quizzes++;st.best=Math.max(st.best,Math.round(good/N*10));
  if(st.dayDate!==t){st.dayDate=t;st.dayPts=0}
  st.dayPts+=Z.pts;
  let streakUp=false;
  if(st.lastDay!==t){st.streak=st.lastDay===yday()?st.streak+1:1;st.lastDay=t;streakUp=true}
  Z.ans.forEach(a=>{const r=st.topics[a.q.t]||(st.topics[a.q.t]={ok:0,n:0});r.n++;if(a.ok)r.ok++});
  let stars=0,unlockedNext=null,prevStars=0;
  if(Z.kind==="level"){
    stars=starsFor(good,N);prevStars=starsOf(Z.key);
    st.levels[Z.key]={stars:Math.max(prevStars,stars)};
    const f=fiche(Z.key),fs=subjFiches(f.s),i=fs.indexOf(f);
    if(stars>=1&&prevStars===0)unlockedNext=i<fs.length-1?fs[i+1]:"defi";
  }
  const subj=Z.kind==="level"?fiche(Z.key).s:Z.kind==="defi"?Z.key:null;
  if(subj&&!st.done.includes(subj))st.done.push(subj);
  const earn=[],give=id=>{if(!st.badges.includes(id)){st.badges.push(id);earn.push(id)}};
  give("premier");
  if(fastN>=5)give("eclair");
  if(Z.kind==="random"&&good>=8)give("touche");
  if(good===N&&N>=5)give("parfait");
  if(Object.keys(SUBJ).every(s=>st.done.includes(s)))give("tour");
  if(curStreak()>=3)give("assidu");
  save();
  const errs=Z.ans.filter(a=>!a.ok),win=good/N>=.7,goalNow=st.dayPts>=st.goal;
  let advice;
  if(!errs.length)advice="Aucune erreur, impressionnant ! Continue sur ton parcours.";
  else{const cnt={};errs.forEach(a=>cnt[a.q.t]=(cnt[a.q.t]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    Z.coachF=fiche(top[0]);advice=`${plural(top[1],"erreur")} sur « ${Z.coachF.t} ». Relis la fiche, puis retente ta chance.`}
  const title=Z.kind==="level"?(stars>=1?"Niveau réussi !":"Encore un effort !"):win?"Quiz terminé, bravo !":"Quiz terminé";
  const nextLevel=unlockedNext&&unlockedNext!=="defi"?unlockedNext:null;
  const kc=subj||"math";
  app.innerHTML=`
  <div class="res">${win?tiger(130,"happy"):dragon(130,"think")}
    <h1>${title}</h1>
    ${Z.kind==="level"?`<div class="bigstars">${[1,2,3].map(n=>starSvg(stars>=n)).join("")}</div>`:""}
    ${unlockedNext?`<p class="muted">${unlockedNext==="defi"?"Tu as débloqué le Défi final de la matière !":"Chapitre suivant débloqué : "+unlockedNext.t}</p>`:Z.kind==="level"&&stars===0?`<p class="muted">Il faut 7 bonnes réponses sur 10 pour gagner une étoile.</p>`:""}
  </div>
  <div class="kpis">
    <div class="kpi math"><div class="h">Score</div><div class="v">${good}/${N}</div></div>
    <div class="kpi" style="--c:var(--gold-d)"><div class="h">Points</div><div class="v">+${Z.pts}</div></div>
    <div class="kpi hg"><div class="h">Série</div><div class="v">${st.streak} j</div></div>
  </div>
  ${streakUp?`<div class="newbadge" style="background:var(--ko-bg);border-color:var(--orange)"><span class="ic" style="background:var(--orange);color:#fff">${ic("flame")}</span><div><b>${st.streak===1?"Série lancée !":"Série prolongée !"}</b><br><span class="muted">${plural(st.streak,"jour")} d'affilée. Reviens demain pour la continuer.</span></div></div>`:""}
  <div class="goal"><div class="goal-top">${ic("target")}<span class="t">Objectif du jour</span><span class="v">${st.dayPts} / ${st.goal} pts</span></div>
    <div class="pbar ${goalNow?"done":""}"><i style="width:${Math.min(100,Math.round(st.dayPts/st.goal*100))}%"></i></div>
    ${goalNow&&!goalBefore?`<p style="color:var(--jade);font-weight:600">Objectif du jour atteint !</p>`:""}</div>
  ${earn.map(id=>{const b=BADGES.find(x=>x.id===id);return`<div class="newbadge"><span class="ic">${ic(b.i)}</span><div><b>Badge débloqué : ${b.n}</b><br><span class="muted">${b.d}</span></div></div>`}).join("")}
  <div class="hero">${dragon(70,"happy")}<div class="bubble"><span class="who">Long, ton coach</span><p>${advice}</p>${errs.length?`<button class="link" id="coachgo">Ouvrir la fiche</button>`:""}</div></div>
  <div class="btns">
    ${nextLevel?`<button class="b3 ${nextLevel.s}" style="background:var(--c);box-shadow:0 5px 0 var(--cd)" id="nextlvl">Chapitre suivant</button>`:""}
    ${errs.length?`<button class="b3 ${nextLevel?"ghost":""}" id="review">Revoir mes ${plural(errs.length,"erreur")}</button>`:""}
    <button class="b3 ghost" id="again">Rejouer</button>
    <button class="b3 ghost" id="home">Retour au parcours</button></div>`;
  if(nextLevel)document.getElementById("nextlvl").onclick=()=>level(nextLevel.id);
  if(errs.length){document.getElementById("review").onclick=()=>review(errs);document.getElementById("coachgo").onclick=()=>level(Z.coachF.id)}
  document.getElementById("again").onclick=()=>startQuiz(Z.kind,Z.key);
  document.getElementById("home").onclick=()=>{if(subj)st.sel=subj;home()};
}

function review(errs){
  app.innerHTML=`
  <div class="bar"><button class="round" id="back" aria-label="Retour">${ic("back")}</button><span class="spacer"></span></div>
  <div class="hero">${dragon(80,"think")}<div class="bubble"><span class="who">Long, ton coach</span><b>À retenir</b><p>Relis bien chaque explication : ce sont des questions tombées au brevet.</p></div></div>
  ${errs.map(a=>`<div class="card err"><div class="tags"><span class="tag">${SUBJ[a.q.s].n} · ${fiche(a.q.t).t}</span><span class="tag">${src(a.q)}</span></div><p style="font-weight:600">${a.q.q}</p>
    <p class="you">${a.chosen===null?"Temps écoulé, pas de réponse":"Ta réponse : "+a.chosen}</p><p class="right">Bonne réponse : ${a.q.a[0]}</p><p class="ex">${a.q.e}</p></div>`).join("")}
  <div class="btns"><button class="b3" id="again">Refaire un quiz</button><button class="b3 ghost" id="home">Retour au parcours</button></div>`;
  document.getElementById("back").onclick=home;
  document.getElementById("again").onclick=()=>startQuiz(Z.kind,Z.key);
  document.getElementById("home").onclick=home;
}

home();
</script>
</body>
</html>
